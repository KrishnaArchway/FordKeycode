term.label.first=Confirm you are requesting an EXCEPTION to making an Online Vehicle Ownership Record before accessing the Key Code.

term.label.second_1=******   Read Carefully  *****
term.label.second_2=Pre-Key Code Request / Online Vehicle Ownership Record Exception
term.label.second_3=Ford key Code Usage Policy requires authorized dealership users to review and retain copies of vehicle ownership verification prior to making a key code request through Keycode.<br><br>There are rare instances (example:  an emergency situation or when the ownership documentation is locked in the vehicle, etc.) where a replacement or duplicate key is needed and the registered vehicle owner is unable to provide the necessary "proof of ownership" documentation prior to making a key code request.

term.label.third_1=On an EXCEPTION basis - and not to exceed two dealership key code requests per month - Ford will permit authorized dealership users to access a vehicle key code without FIRST having entered an online vehicle ownership verification record.  
term.label.third_2=Vehicle ownership documentation is still required on an "after the fact" basis.  By obtaining a key code without having established an online vehicle ownership record, authorized users are agreeing to submit a vehicle ownership verification form <font color="#FF0000">within three business days</font> of making the key code request.

term.label.fourth=<b><font color="#FF0000">NOTE</font></b>:  Obtaining a key code by using this method is an exception to the standard key code retrieval process.  Pre-Key Code Request / Online Vehicle Ownership Record Exceptions will be closely monitored.  Failure to comply with the Pre-Key Code Request /Online Vehicle Ownership Record Exception Terms of Agreement may result in a dealership key code usage audit.  Dealerships found in violation of the Ford Key Code Usage Policy risk having restricted access or loss of the vehicle key code application on Keycode.

term.label.agrement_1=PRE-KEY CODE REQUEST / ONLINE VEHICLE OWNERSHIP RECORD EXCEPTION TERMS OF AGREEMENT
term.label.agrement_2=All authorized dealership users must accept the Terms of Agreement for this exception, BEFORE accessing key code information:<br><ul><li>I have a situation where vehicle ownership information is not available in order to establish an online vehicle ownership record prior to accessing the key code;<ul><li>This key code information is being requested on behalf of the registered owner of the vehicle;</li><li>This key code information is not being given and/or sold to third-party agencies Without retaining a copy of the written consent of the registered owner of the vehicle in question;</li></ul></li><li>I will provide complete vehicle ownership verification information to Key Code Program Headquarters <font color="#FF0000">within three business days</font> of making this key code request.</li><li>I understand that this exception-based approach to obtaining a vehicle key code (one where an online vehicle ownership record is deferred until after the key code is accessed) will be closely monitored.  Dealership key code access may be restricted or removed with any inappropriate use of the exception-based approach for obtaining vehicle key codes.</li></ul>
term.label.agrement_3=<b>Non-compliance of any or all of these guidelines will subject the Dealership and its application user to revocation of access to this application by Ford Motor Company and could subject the Dealership to civil liabilities if pursued by the vehicle owner. Additionally, since proper identification and safeguarding of the information is strongly encouraged and is the sole responsibility of the Dealership, Ford Motor Company will not be responsible under any circumstances for the validation and issuance of key code information. Moreover, our dealership will use Reasonable Care to protect the security, integrity and confidentiality of any Personally Identifiable Information to which it is exposed. "Reasonable Care" is defined as the standard of care the Dealer will use in protecting the security, integrity and confidentiality of its own confidential information.<b>

term.label.link=Click Here
term.label.button.continue=CONTINUE
term.label.button.terAgreement=GO TO TERMS OF AGREEMENT
term.label.button.accept=I accept these terms
term.label.button.decline=I do not accept these terms

thankyou.msg=<b>Your Ownership Verification Record has been submitted.</b>
#thankyou.exception.msg=A Pre-Key Code Ownership Vehicle Exception has been approved.  You have agreed to complete the online vehicle ownership verification for this VIN.  The complete information must be submitted along with the Vehicle Ownership Verification form, emailed or faxed to Program Headquarters at fordadmin@archway.com or (734) 713-2971 within <font color=red><b>Three Business Days</b></font> of making the key code request through FMCDealer.com.
thankyou.exception.msg=Your exception request has been approved.

term.label.exceptionhead = <b>Exception Process</b>
term.label.exception1 = <li>The exception process is to be used in emergency situations when a replacement or duplicate key is needed and the necessary “proof of ownership” documentation is unavailable prior to key code retrieval</li>
term.label.exception2 = <li>The use of the exception process is <b>not to exceed ten</b> dealership key code requests per month</li>
term.label.exception3 = <li>Vehicle ownership documentation must be obtained as soon as possible and should be retained in case of a dealer audit</li>
term.label.exception4 = <li>Use of the exception process will be closely monitored and subject to audit. Failure to comply with the Terms of Agreement and Key Code Usage Policy may result in the dealership access to key codes either restricted or revoked</li>




 