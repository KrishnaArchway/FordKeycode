showHomePage.label.information=Information
showHomePage.label.information.message1=In accordance with the Ford Key Code Usage Policy, dealership personnel who are authorized to access key code information must see and retain a copy of a completed & signed Vehicle Ownership Verification Form, the registered owner's valid driver's license in addition to at least one other proof of vehicle ownership.
showHomePage.label.information.message2=Select "Next" to create an ownership record

showHomePage.label.information.link1=Vehicle Ownership Record Now Required
showHomePage.label.information.link1.msg=Prior to obtaining and releasing vehicle key code information, dealership personnel must establish an online record of the registered vehicle owner in the Ownership Verification database.

showHomePage.label.information.link2=One Time Ownership Record Use
showHomePage.label.information.link2.msg=An individual ownership record can only be used one time to make a key code request.   A new ownership record will be required each time there are additional key code requests for the same VIN.

showHomePage.label.information.link4=Record Retention - One Week

showHomePage.label.information.link3=Ownership Records for Individuals, Businesses, Fleets and dealership owned used vehicles
showHomePage.label.information.link3.msg=Ownership information on fleet and/or business owned vehicles must be entered as well as certain information about dealership owned used vehicles.

showHomePage.label.information.link4=Record Retention - One Week
showHomePage.label.information.link4.msg=An Ownership Record will exist in the database for seven days before expiring.  Should a key code request be made on a VIN where an Ownership record was added more than seven days prior, a new ownership record will be required for that VIN.

showHomePage.label.information.link5=Vehicle Ownership Record Exception Provision
showHomePage.label.information.link5.msg=The online data entry process offers the ability for authorized dealership users to create an emergency/exception record in a situation where complete ownership information is unavailable.  In such cases, dealership users who make a key code request through the use of the ownership record exception method will be required to provide ownership record information via fax or email within three business days after entering an ownership record.  Authorized users must provide complete ownership verification information following a key code request made with an ownership record exception.   Failure to do so may result in restricting dealership key code access.    Use of the exception process will be carefully monitored.

showHomePage.label.next.button=Next
